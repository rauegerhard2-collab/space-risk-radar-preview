name: Weekly data review PR

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-review:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly review pull request when staging differs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_COUNT=$(gh pr list --base main --head data-staging --state open --json number --jq 'length')
          if [ "$OPEN_COUNT" -gt 0 ]; then
            echo "A weekly data review PR is already open."
            exit 0
          fi
          gh pr create --base main --head data-staging --title "Weekly orbital data refresh review" --body "Please review the staged public-source snapshots, retrieval timestamps, source log and data-quality gates. Merge only after review. This publishes to Preview Pages only; production is not connected."
